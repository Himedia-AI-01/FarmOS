# Replace app.farmos.biz / shop.farmos.biz with your real domains.
# Until certbot has issued certs, comment out the 443 blocks and the redirect,
# leave only the 80 blocks serving HTTP. Then run certbot and re-enable HTTPS.

# ---------- FarmOS frontend ----------
server {
    listen 80;
    server_name app.farmos.biz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name app.farmos.biz;

    ssl_certificate     /etc/letsencrypt/live/app.farmos.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.farmos.biz/privkey.pem;

    root /var/www/farmos;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /uploads/ {
        proxy_pass http://farmos-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /api/ {
        proxy_pass http://farmos-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# ---------- Shopping mall frontend ----------
