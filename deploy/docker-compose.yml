services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_MULTIPLE_DATABASES: farmos,shop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  farmos-backend:
    build:
      context: ../backend
      dockerfile: ../deploy/farmos.Dockerfile
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-farmos}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/farmos
      # shop_reviews / shop_products 는 shop DB 에 들어있어 cross-DB 조회가 필요하다
      # (예: GET /api/v1/reviews/list, ChromaDB sync_from_db). 비어있으면 DATABASE_URL 폴백.
      SHOP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-farmos}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/shop
      REDIS_URL: redis://redis:6379/0
    volumes:
      - farmos-chroma:/app/chroma_data
      - farmos-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  shop-backend:
    build:
      context: ../shopping_mall/backend
      dockerfile: ../../deploy/shop.Dockerfile
    env_file: ../shopping_mall/backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-farmos}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/shop
    volumes:
      - shop-chroma:/app/chroma_data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/var/www/farmos:ro
      - ../shopping_mall/frontend/dist:/var/www/shop:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - farmos-backend
      - shop-backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  farmos-chroma:
  farmos-data:
  shop-chroma:
  certbot-webroot:
